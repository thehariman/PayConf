<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thiranex | Payment Settings</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo-area">
                <div class="logo-icon"><i data-lucide="shield-check"></i></div>
                <h1>Thiranex</h1>
            </div>
            <nav class="main-nav">
                <a href="index.html" class="nav-item">
                    <i data-lucide="layout-dashboard"></i>
                    <span>Dashboard</span>
                </a>
                <a href="settings.html" class="nav-item active">
                    <i data-lucide="settings"></i>
                    <span>Settings</span>
                </a>
                <a href="reports.html" class="nav-item">
                    <i data-lucide="file-text"></i>
                    <span>Reports</span>
                </a>
            </nav>
        </aside>

        <script type="module" src="auth_check.js"></script>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-bar">
                <div class="welcome">
                    <h2 style="font-family: 'Outfit', sans-serif;">Payment Categorization</h2>
                    <p>Map payment amounts to custom notes (e.g., 100 = Internship Fee).</p>
                </div>
            </header>

            <section style="margin-top: 32px; max-width: 600px;">
                <div class="table-container" style="padding: 24px;">
                    <div style="display: flex; gap: 12px; margin-bottom: 24px;">
                        <input type="number" id="newAmount" placeholder="Amount (e.g. 100)" style="flex: 1; padding: 12px; border-radius: 10px; border: 1px solid var(--border-light); outline: none;">
                        <input type="text" id="newLabel" placeholder="Note (e.g. Internship Fee)" style="flex: 2; padding: 12px; border-radius: 10px; border: 1px solid var(--border-light); outline: none;">
                        <button id="addMappingBtn" class="btn btn-primary">Add Rule</button>
                    </div>

                    <div id="mappingList">
                        <!-- Mappings will appear here -->
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, setDoc, onSnapshot, deleteDoc, collection } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { firebaseConfig } from "./firebase_config.js";

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const newAmount = document.getElementById('newAmount');
        const newLabel = document.getElementById('newLabel');
        const addBtn = document.getElementById('addMappingBtn');
        const mappingList = document.getElementById('mappingList');

        // Listen to mappings
        onSnapshot(collection(db, "payment_mappings"), (snapshot) => {
            mappingList.innerHTML = snapshot.docs.length === 0 ? '<p style="color: var(--text-dim); text-align: center;">No rules defined. Default will be "Others".</p>' : '';
            snapshot.forEach(docSnap => {
                const data = docSnap.data();
                const item = document.createElement('div');
                item.style = "display: flex; justify-content: space-between; align-items: center; padding: 12px; background: #f8fafc; border-radius: 10px; margin-bottom: 8px; border: 1px solid var(--border-light);";
                item.innerHTML = `
                    <div>
                        <strong style="color: var(--primary);">₹${data.amount}</strong>
                        <span style="margin-left: 12px; color: var(--text-main); font-weight: 500;">${data.label}</span>
                    </div>
                    <button class="delete-rule" data-id="${docSnap.id}" style="background: none; border: none; color: var(--danger); cursor: pointer; display: flex; align-items: center;">
                        <i data-lucide="x-circle" style="width: 18px;"></i>
                    </button>
                `;
                mappingList.appendChild(item);
            });
            lucide.createIcons();

            // Add delete listeners
            document.querySelectorAll('.delete-rule').forEach(btn => {
                btn.onclick = async () => {
                    await deleteDoc(doc(db, "payment_mappings", btn.dataset.id));
                };
            });
        });

        addBtn.onclick = async () => {
            const amount = newAmount.value;
            const label = newLabel.value;
            if (!amount || !label) return;

            await setDoc(doc(db, "payment_mappings", amount), {
                amount: parseInt(amount),
                label: label
            });

            newAmount.value = '';
            newLabel.value = '';
        };

        lucide.createIcons();
    </script>
</body>
</html>
