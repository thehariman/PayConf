<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings | PayConf</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="app-container">
        <div id="sidebarOverlay" class="sidebar-overlay"></div>
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo-area">
                <div class="logo-icon">
                    <img src="logo.png" alt="Logo" style="width: 100%; border-radius: 6px;">
                </div>
                <div class="logo-text-group">
                    <h1 style="font-size: 20px;">PayConf</h1>
                    <span style="font-size: 10px; color: var(--text-dim); opacity: 0.8; font-weight: 500;">Managed by Thiranex</span>
                </div>
            </div>
            
            <button id="sidebarCollapse">
                <i data-lucide="chevron-left"></i>
            </button>
            <nav class="main-nav">
                <a href="index.html" class="nav-item">
                    <i data-lucide="layout-dashboard"></i>
                    <span>Dashboard</span>
                </a>
                <a href="settings.html" class="nav-item active">
                    <i data-lucide="settings"></i>
                    <span>Settings</span>
                </a>
                <a href="reports.html" class="nav-item">
                    <i data-lucide="file-text"></i>
                    <span>Reports</span>
                </a>
            </nav>
        </aside>

        <script type="module" src="auth_check.js"></script>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-bar">
                <button id="menuToggle" class="menu-toggle">
                    <i data-lucide="menu"></i>
                </button>
                <div style="flex: 1;"></div>
                <div class="user-profile" id="adminDropdownTrigger">
                    <div class="avatar">AD</div>
                    <div class="admin-info">
                        <span class="badge">Super Admin</span>
                    </div>
                    <i data-lucide="chevron-down" style="width: 16px; color: var(--text-dim);"></i>
                </div>
            </header>

            <section class="dashboard-header">
                <div class="welcome">
                    <h2 style="font-family: 'Outfit', sans-serif;">Payment Categorization</h2>
                    <p>Map payment amounts to custom notes (e.g., 100 = Internship Fee).</p>
                </div>
            </section>

            <section style="margin-top: 32px; max-width: 600px;">
                <div class="table-container" style="padding: 24px;">
                    <div style="display: flex; gap: 12px; margin-bottom: 24px;">
                        <input type="number" id="newAmount" placeholder="Amount (e.g. 100)" style="flex: 1; padding: 12px; border-radius: 10px; border: 1px solid var(--border-light); outline: none;">
                        <input type="text" id="newLabel" placeholder="Note (e.g. Internship Fee)" style="flex: 2; padding: 12px; border-radius: 10px; border: 1px solid var(--border-light); outline: none;">
                        <button id="addMappingBtn" class="btn btn-primary">Add Rule</button>
                    </div>

                    <div id="mappingList">
                        <!-- Mappings will appear here -->
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, setDoc, onSnapshot, deleteDoc, collection } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { firebaseConfig } from "./firebase_config.js";

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const newAmount = document.getElementById('newAmount');
        const newLabel = document.getElementById('newLabel');
        const addBtn = document.getElementById('addMappingBtn');
        const mappingList = document.getElementById('mappingList');

        // Listen to mappings
        onSnapshot(collection(db, "payment_mappings"), (snapshot) => {
            mappingList.innerHTML = snapshot.docs.length === 0 ? '<p style="color: var(--text-dim); text-align: center;">No rules defined. Default will be "Others".</p>' : '';
            snapshot.forEach(docSnap => {
                const data = docSnap.data();
                const item = document.createElement('div');
                item.style = "display: flex; justify-content: space-between; align-items: center; padding: 12px; background: #f8fafc; border-radius: 10px; margin-bottom: 8px; border: 1px solid var(--border-light);";
                item.innerHTML = `
                    <div>
                        <strong style="color: var(--primary);">₹${data.amount}</strong>
                        <span style="margin-left: 12px; color: var(--text-main); font-weight: 500;">${data.label}</span>
                    </div>
                    <button class="delete-rule" data-id="${docSnap.id}" style="background: none; border: none; color: var(--danger); cursor: pointer; display: flex; align-items: center;">
                        <i data-lucide="x-circle" style="width: 18px;"></i>
                    </button>
                `;
                mappingList.appendChild(item);
            });
            lucide.createIcons();

            // Add delete listeners
            document.querySelectorAll('.delete-rule').forEach(btn => {
                btn.onclick = async () => {
                    await deleteDoc(doc(db, "payment_mappings", btn.dataset.id));
                };
            });
        });

        // Sidebar Toggle Logic
        const sidebar = document.querySelector('.sidebar');
        const sidebarOverlay = document.getElementById('sidebarOverlay');
        const menuToggle = document.getElementById('menuToggle');
        const collapseBtn = document.getElementById('sidebarCollapse');

        if (menuToggle) {
            menuToggle.addEventListener('click', () => {
                sidebar.classList.toggle('active');
                sidebarOverlay.classList.toggle('active');
            });
        }

        if (sidebarOverlay) {
            sidebarOverlay.addEventListener('click', () => {
                sidebar.classList.remove('active');
                sidebarOverlay.classList.remove('active');
            });
        }

        if (collapseBtn) {
            collapseBtn.onclick = () => {
                document.body.classList.toggle('sidebar-collapsed');
                const icon = collapseBtn.querySelector('i');
                if (document.body.classList.contains('sidebar-collapsed')) {
                    icon.setAttribute('data-lucide', 'chevron-right');
                } else {
                    icon.setAttribute('data-lucide', 'chevron-left');
                }
                lucide.createIcons();
            };
        }

        addBtn.onclick = async () => {
            const amount = newAmount.value;
            const label = newLabel.value;
            if (!amount || !label) return;

            await setDoc(doc(db, "payment_mappings", amount), {
                amount: parseInt(amount),
                label: label
            });

            newAmount.value = '';
            newLabel.value = '';
        };

        lucide.createIcons();
    </script>
</body>
</html>
